# Formula smoke test — feature homebrew-binary-distribution.
#
# Runs the REAL user-facing `brew tap → trust → install` flow against the live tap +
# GitHub Release and asserts `openlore --version`, so a broken formula (bad sha256,
# missing release asset, tap/trust regression) fails CI instead of the user. Triggers
# whenever the formula (or this test) changes on main, plus on demand. The release.yml
# `bump-formula` autobump pushes with GITHUB_TOKEN, which does NOT fire `push`
# workflows, so that job dispatches this workflow explicitly after it pushes.
#
# macOS only (ADR-061 D-6 amendment, 2026-09-27): the per-triple, release-blocking
# probe is relaxed to a post-bump macos-14 (aarch64-apple-darwin) smoke test.
name: Formula smoke test

on:
  push:
    branches: [main]
    paths:
      - "Formula/openlore.rb"
      - "scripts/release/smoke-test-formula.sh"
      - ".github/workflows/formula-smoke.yml"
  workflow_dispatch:

concurrency:
  group: formula-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: brew install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon (aarch64-apple-darwin). Linux and Intel-mac installs
        # are deliberately not smoke-tested for now (ADR-061 D-6 amendment).
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: brew tap → trust → install → version
        run: bash scripts/release/smoke-test-formula.sh
