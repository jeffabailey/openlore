# CI — commit + acceptance stages per devops/ci-cd-pipeline.md §3-§4.
#
# Commit stage (parallel jobs): fmt | clippy | cargo-deny | xtask check-arch |
# xtask check-probes. Acceptance stage (test job) gates on commit-stage success
# and runs the full nextest workspace suite (unit + acceptance + integration
# tests share the same `cargo test` runner per Rust convention).
#
# Wall-clock targets: ~5 min commit, ~10 min acceptance (ci-cd-pipeline.md §3.8).
# Cache via Swatinem/rust-cache@v2 keyed on Cargo.lock (§8).
#
# Known flake workaround: adapter-system-clock tests race on the OPENLORE_TEST_NOW
# env var when run in parallel; --test-threads=1 serializes them. Revisit if/when
# the env-var injection is refactored to a per-test fixture.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs of the same workflow on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  check-arch:
    name: check-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Step 01-06: gate the extended rule set (no_cross_table_join_elides_author
      # / I-FED-1 + autoconfirm release-build guard / D-D20) by running the xtask
      # rule tests BEFORE the check itself. The anti_merging + autoconfirm_guard
      # integration tests pin the classifiers' positive/negative behavior.
      - name: cargo test -p xtask (arch-rule unit + integration tests)
        run: cargo test -p xtask
      - name: cargo xtask check-arch
        run: cargo run -p xtask -- check-arch

  check-probes:
    name: check-probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask check-probes
        run: cargo run -p xtask -- check-probes

  test:
    name: test (acceptance stage)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny, check-arch, check-probes]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build binaries the acceptance tests spawn (openlore + openlore-indexer + openlore-review-app)
        # Acceptance suites spawn the `openlore` and CROSS-package `openlore-indexer`
        # executables via the test-support resolver (target/debug). nextest builds
        # test harnesses, not these `[[bin]]` targets — build them explicitly first
        # (openlore-indexer is bin-only, so cli's dev-dependency on it is ignored).
        # bluesky-claim-review-app (DWD-3): the cli review_app_walking_skeleton +
        # review_app_self_attested_readers suites spawn `openlore-review-app` from
        # target/debug with NO cli dev-dependency on the app (check-arch keeps the
        # roots disjoint), so it is built here too.
        run: cargo build --bin openlore --bin openlore-indexer --bin openlore-review-app
      - name: cargo nextest run --workspace
        # --test-threads=1 works around the OPENLORE_TEST_NOW env-var race in
        # adapter-system-clock tests. See file header comment.
        # --no-fail-fast: surface EVERY failing test in one run (dev feedback),
        # rather than stopping at the first — the run still fails if any test does.
        run: cargo nextest run --workspace --test-threads=1 --no-fail-fast

  # ------------------------------------------------------------------------------------------
  # Review app image (bluesky-claim-review-app; devops/ci-cd-pipeline.md §3). main pushes only,
  # after the acceptance stage, so an image never exists for a red commit. CI builds, scans,
  # signs and publishes; it never deploys (deploy/review-app/deploy.sh, laptop-initiated).
  # ------------------------------------------------------------------------------------------

  review-app-build:
    name: review-app build (arm64, bookworm)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-24.04-arm
    # Built in a bookworm container so the binary's glibc symbols match distroless
    # cc-debian12 (2.36); an ubuntu-24.04 build links 2.39 and fails to load there.
    container:
      image: rust:1-bookworm@sha256:59037199c44290f2befcdd58dcc540164763fc296950255aaefeef096a1866b0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: review-app-arm64
      - name: cargo build --release -p openlore-review-app
        run: cargo build --release --locked -p openlore-review-app
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Stage binary + CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          strip target/release/openlore-review-app
          cp target/release/openlore-review-app out/
          # cargo-cyclonedx 0.5.x: scope with --manifest-path (see release.yml).
          cargo cyclonedx --format json --manifest-path crates/openlore-review-app/Cargo.toml --override-filename sbom
          cp crates/openlore-review-app/sbom.json out/openlore-review-app.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: openlore-review-app-aarch64
          path: out/
          retention-days: 1
          if-no-files-found: error

  review-app-image:
    name: review-app image (smoke, scan, push, sign, attest)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [review-app-build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # GitHub OIDC: cosign keyless + attestations
      attestations: write   # SLSA build provenance
    env:
      IMAGE: ghcr.io/jeffabailey/openlore-review-app
      LOCAL_TAG: openlore-review-app:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openlore-review-app-aarch64
          path: ${{ runner.temp }}/ctx
      - uses: docker/setup-buildx-action@v3

      - name: Build image (runtime-only distroless)
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/ctx/openlore-review-app.cdx.json" "$RUNNER_TEMP/cargo.cdx.json"
          docker buildx build --platform linux/arm64 --load \
            -f crates/openlore-review-app/Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$LOCAL_TAG" "$RUNNER_TEMP/ctx"

      - name: Smoke (dynamic linking + offline probe self-test)
        run: |
          set -euo pipefail
          docker run --rm "$LOCAL_TAG" --version
          docker run --rm --read-only --tmpfs /tmp:size=16m --network none --cap-drop ALL \
            --security-opt no-new-privileges:true "$LOCAL_TAG" probe --self-test

      - name: Scan (trivy, HIGH/CRITICAL blocks)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR and record the digest
        id: push
        run: |
          set -euo pipefail
          docker tag "$LOCAL_TAG" "$IMAGE:sha-${GITHUB_SHA}"
          docker tag "$LOCAL_TAG" "$IMAGE:main"
          docker push "$IMAGE:sha-${GITHUB_SHA}"
          docker push "$IMAGE:main"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$LOCAL_TAG" \
            | grep "^${IMAGE}@" | head -n1 | cut -d@ -f2)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no pushed digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
      - name: Sign (cosign keyless, by digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: SBOM of the image (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOMs (cargo + image, cosign)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/cargo.cdx.json" "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/image.cdx.json" "$IMAGE@$DIGEST"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### openlore-review-app image"
            echo "- digest: \`$IMAGE@$DIGEST\`"
            echo "- tags: \`sha-${GITHUB_SHA}\`, \`main\`"
            echo "- deploy (laptop): \`deploy/review-app/deploy.sh deploy ${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
