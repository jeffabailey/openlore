# Publish contract test — feature serverless-philosophy-federation (DV-1, ADR-062).
#
# The REAL integration test for the `atproto/` Worker: type-check it (strict),
# audit its npm tree, start it under LOCAL workerd (`wrangler dev`), then drive
# the REAL `openlore` CLI through `publish init <url>` -> `push` -> `pull` with
# the 0.0 / 0.5 / 1.0 gold-fixture claims, failing on any CID mismatch; then
# a second `push` must report `pushed: 0` and raw re-PUTs (incl. concurrent
# identical ones) of a committed CID must leave the manifest's length and
# distinct-CID set unchanged — real Durable Object idempotency (step 02-02).
# Write auth (step 02-03, DV-4): the script generates a THROWAWAY fixture owner
# token into the git-ignored `atproto/.dev.vars` (the Worker secret under
# `wrangler dev`) and passes the same value to the CLI; it asserts that a
# token-less (and wrong-token) push is refused as an `unauthorized write` with
# nothing stored, and that GET /, /manifest and /records stay public.
# Public card (step 04-01, US-SF-005): `GET /` must honour the shared card
# contract — "no claims published yet" before the first push, then exactly one
# `<li class="claim" data-cid data-author>` row per pushed claim attributed to
# its author_did, no authoring control, no merged row, restrictive CSP, and a
# hostile manifest entry rendered HTML-escaped. The token
# is not a repo file, not in wrangler.toml, and not a CI secret. The
# Rust acceptance suite covers the same contract against the FakeInstance
# double; this job proves the Worker honours it byte-for-byte.
#
# Never deploys: no `wrangler deploy`, no Cloudflare account, no API token —
# deployment is a user-run step against the user's OWN account.
name: Publish contract test

on:
  push:
    branches: [main]
    paths:
      - "atproto/**"
      - "crates/publish-domain/**"
      - "crates/adapter-publish-http/**"
      - "crates/lexicon/**"
      - "crates/cli/src/verbs/publish.rs"
      - "crates/cli/src/render/publish.rs"
      - ".github/workflows/publish-contract.yml"
  workflow_dispatch:

concurrency:
  group: publish-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WRANGLER_SEND_METRICS: "false"

jobs:
  contract:
    name: wrangler dev round trip (0.0/0.5/1.0) + idempotency + write auth + card
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: atproto/package-lock.json
      - name: npm ci
        working-directory: atproto
        run: npm ci
      - name: tsc --noEmit (strict via tsconfig)
        working-directory: atproto
        run: npx tsc --noEmit
      - name: npm audit --audit-level=high
        working-directory: atproto
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build openlore
        run: cargo build --release -p cli --bin openlore
      - name: guard — the fixture .dev.vars is git-ignored and never tracked
        run: |
          git check-ignore -q atproto/.dev.vars
          ! git ls-files --error-unmatch atproto/.dev.vars 2>/dev/null
      - name: wrangler dev -> write-auth refusal + publish init/push/pull round trip + idempotent re-push + public card
        run: bash atproto/scripts/contract-roundtrip.sh target/release/openlore
