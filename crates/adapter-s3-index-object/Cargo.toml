[package]
name = "adapter-s3-index-object"
version = "0.0.1"
edition.workspace = true
# D-STZ-35: only the two Lambda crates need 1.94.1, for the AWS SDK. The workspace
# stays at 1.91.
rust-version = "1.94.1"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenLore index object EFFECT shell (ADR-090): IndexObjectReadPort and IndexObjectWritePort over S3, RepoDidListSourcePort over SSM. The only adapter that links aws-* crates."

# The AWS SDK (D-STZ-3, D-STZ-35, D-STZ-36): rustls with ring, `default-features =
# false` everywhere so no aws-lc reaches the graph. xtask `aws_sdk_only_in_lambda_edge`
# keeps these out of every other crate (P-2); deny.toml bans aws-lc (P-3).
[dependencies]
ports = { path = "../ports" }
async-trait = "0.1.92"
aws-config = { version = "1.13.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1.155.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-ssm = { version = "1.131.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5.1", default-features = false, features = ["rustls-ring"] }

[dev-dependencies]
# The real-I/O contract against moto (DEVOPS UD-5), gated on
# OPENLORE_TEST_MOTO_ENDPOINT. reqwest only seeds the moto bucket and parameter.
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tempfile = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }

[[test]]
name = "scale_to_zero_object_store_real_io"
path = "../../tests/acceptance/scale_to_zero_object_store_real_io.rs"
harness = true

[lints]
workspace = true
