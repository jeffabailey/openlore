[package]
name = "scraper-domain"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenLore pure scraper domain: derive_candidates + the signal->predicate mapping (embedded jobs.yaml SSOT). NO I/O."

[lib]
path = "src/lib.rs"

# PURE (WD-56): pure core + effect shell paradigm — this crate is pure core.
# Consumes `ports::Signal`, produces `ports::CandidateClaim` (Q-DELIVER-3:
# the slice-02 value types live in `ports`, both pure). The signal->predicate
# mapping is the `jobs.yaml :: J-004.signal_predicate_mapping` SSOT, embedded
# at compile time via `include_str!` (no filesystem I/O) and parsed by a pure
# YAML parser.
#
# Forbidden (I-2; enforced by `cargo xtask check-arch`): tokio, reqwest,
# duckdb, keyring, atrium-*, std::fs/net/process/env/SystemTime, any adapter-*.
#
# `serde-saphyr` is the YAML parser (replaced `serde_yaml_ng` 2026-10-13): safe
# Rust over a pure-Rust parser, so no unsafe-libyaml (RUSTSEC-2024-0449). It is a
# PURE parser — no I/O, no async runtime — so it is on the `xtask check-arch`
# pure-core allowlist (WD-65). Deserialize only. Pinned crate-locally because
# only this pure crate parses the embedded mapping.
[dependencies]
ports = { path = "../ports" }
serde = { workspace = true }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
# slice-28 (US-PV-007): resolve each mapping object against the real seeded
# philosophy vocabulary (`lexicon::philosophy::find`) so `load_mapping` rejects
# any object that is not a SEEDED philosophy (AC-007.2 / KPI-PV-6). `lexicon` is
# a PURE crate (no I/O — serde/serde_json only) so it is a safe pure-core edge;
# no dependency cycle — `lexicon` does not depend on scraper-domain.
lexicon = { path = "../lexicon" }
# contributor-philosophy-inference DDD-7 / Q-CPI-D2: the ADR-060 self-retraction
# rule (and same-author supersession) is SHARED from the pure `claim-domain`
# (`is_self_retracted` / `is_superseded_by_author`) — one rule, not two copies.
# `claim-domain` is pure (no I/O) and already reached transitively via `ports`.
claim-domain = { path = "../claim-domain" }

[dev-dependencies]
proptest = { workspace = true }
