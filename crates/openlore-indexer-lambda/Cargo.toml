[package]
name = "openlore-indexer-lambda"
version = "0.0.1"
edition.workspace = true
# D-STZ-35: only the two Lambda crates need 1.94.1, for the AWS SDK. The workspace
# stays at 1.91.
rust-version = "1.94.1"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenLore index on AWS Lambda: the FOURTH composition root (ADR-090). search | pass | probe from one signed image. Signing-incapable; holds no local claim store."

[lib]
path = "src/lib.rs"

[[bin]]
name = "openlore-indexer-lambda"
path = "src/main.rs"

# The fourth composition root (check-arch COMPOSITION_ROOTS). Its capability
# boundary is the graph rule `indexer_lambda_holds_no_signing_or_local_store`:
# adapter-atproto-did is here for the verify-only `resolve_only()` alone
# (D-STZ-50). adapter-index-query is the probe's bounded client (D-STZ-37). Still
# to come: adapter-s3-index-object, lambda_http, lambda_runtime and aws-config.
[dependencies]
ports = { path = "../ports" }
appview-domain = { path = "../appview-domain" }
openlore-indexer = { path = "../openlore-indexer" }
adapter-atproto-did = { path = "../adapter-atproto-did" }
adapter-index-query = { path = "../adapter-index-query" }
adapter-index-store = { path = "../adapter-index-store" }
adapter-xrpc-query-server = { path = "../adapter-xrpc-query-server" }
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

# The acceptance harness drives the entry points in-process with the external
# ports faked; the PDSes and PLC are the shared FakeAtprotoNetwork. None of
# these reach an adapter-* crate (check-arch I-3).
[dev-dependencies]
openlore-test-support = { path = "../test-support" }
claim-domain = { path = "../claim-domain" }
async-trait = "0.1.92"
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tempfile = { workspace = true }
proptest = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[[test]]
name = "scale_to_zero_walking_skeleton"
path = "../../tests/acceptance/scale_to_zero_walking_skeleton.rs"
harness = true

[[test]]
name = "scale_to_zero_search"
path = "../../tests/acceptance/scale_to_zero_search.rs"
harness = true

[[test]]
name = "scale_to_zero_pass"
path = "../../tests/acceptance/scale_to_zero_pass.rs"
harness = true

[[test]]
name = "scale_to_zero_probe"
path = "../../tests/acceptance/scale_to_zero_probe.rs"
harness = true

[[test]]
name = "scale_to_zero_harness"
path = "../../tests/acceptance/scale_to_zero_harness.rs"
harness = true

[[test]]
name = "scale_to_zero_core"
path = "../../tests/acceptance/scale_to_zero_core.rs"
harness = true

[lints]
workspace = true
